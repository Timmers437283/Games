<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Gotham City Rush</title>
    <script src="https://fastly.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #0c0c0c;
            color: #f5f5f5;
            font-family: 'Google Sans', Arial, sans-serif;
            overflow: hidden;
        }

        #s {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 32px;
            padding: 20px;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 23px);
            line-height: 1.8;
            text-align: center;
            margin: 0;
            font-weight: 400;
        }

        button {
            min-width: 180px;
            background: #1b1b1b;
            color: #f5f5f5;
            border: 1px solid #353535;
            border-radius: 6px;
            padding: 15px 30px;
            font-family: 'Google Sans', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        button:hover {
            background: #252525;
            border-color: #505050;
        }

        button:active {
            background: #303030;
        }

        #g {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #g ruffle-player {
            display: block;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
        }
    </style>
</head>

<body>

    <div id="s">
        <h1>GOTHAM CITY RUSH</h1>
        <button onclick="p()">START</button>
    </div>

    <div id="g"></div>

    <script>
        let started = false;

        async function p() {
            if (started) return;
            started = true;

            document.getElementById("s").style.display = "none";

            const game = document.getElementById("g");
            game.style.display = "block";

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "100%";

            game.appendChild(player);

            player.load("https://raw.githubusercontent.com/noracismphunkk-ctrl/emulate/refs/heads/main/gotham-city-rush.swf");
        }
    </script>

</body>
</html>
